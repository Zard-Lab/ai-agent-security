name: agentsec security audit
description: >-
  Stack-aware security audit for FastAPI, React, Postgres/Supabase and LLM/RAG apps. Runs from the
  action's own checkout on your runner: your code never leaves it. Job summary, capped PR
  annotations, a SARIF artifact, optional code-scanning upload, and a pass/fail gate.
author: agentsec
branding:
  icon: shield
  color: purple

# How it runs: `python -m agentsec` straight from this action's checkout (agentsec has zero runtime
# dependencies), so there is no install step, no network fetch and no token, and the CLI version is
# exactly the ref you pinned in `uses:`. Pin that ref to a full commit SHA: a tag can be moved.
#
# Inputs reach the shell ONLY through `env:`, never as `${{ inputs.* }}` inside `run:` (the
# script-injection rule; tests/test_action.py enforces it). The docs table lives in
# docs/user-guide.md section 16 and the same test fails when an input is missing from it.

inputs:
  path:
    description: Directory to scan, relative to the checkout root.
    required: false
    default: "."
  fail-on:
    description: Lowest severity that fails the gate. One of critical, high, medium.
    required: false
    default: high
  mode:
    description: >-
      gate (fail the job when the gate trips) or advisory (report, warn, and pass). A scan that did
      not complete fails the job in both modes.
    required: false
    default: gate
  scanners:
    description: >-
      deterministic (guards plus installed static scanners, no live-advisory lookups; reproducible),
      guards-only (the dependency-free guards alone), or all (every installed scanner).
    required: false
    default: deterministic
  baseline:
    description: Exception registry to apply (agentsec --baseline). Empty uses the CLI default.
    required: false
    default: ""
  baseline-snapshot:
    description: >-
      A saved snapshot (agentsec audit --save-snapshot): findings it records stay in the report
      but only NEW findings fail the gate or get annotated.
    required: false
    default: ""
  exclude:
    description: Path patterns to drop from the report, one per line (agentsec --exclude).
    required: false
    default: ""
  top:
    description: How many findings the job summary lists in detail (the full tally is always shown).
    required: false
    default: "50"
  annotations:
    description: >-
      How many of the most severe findings that are not baselined (any severity, most severe first)
      to annotate inline on the PR. GitHub caps the annotations a step can show, so keep this small;
      the SARIF and the summary carry the rest. 0 turns them off.
    required: false
    default: "10"
  coverage:
    description: >-
      true adds the checklist coverage score card (agentsec coverage: covered, partial, manual and
      not-applicable checklist items per section) to the job summary and the artifact. It never
      affects the verdict.
    required: false
    default: "false"
  upload-sarif:
    description: >-
      true uploads the SARIF to GitHub code scanning (needs security-events write; on a private
      repo it also needs GitHub Code Security).
    required: false
    default: "false"
  sarif-category:
    description: Code-scanning category for the upload, so several scans of one repo stay apart.
    required: false
    default: agentsec
  artifact-name:
    description: Name of the uploaded artifact (SARIF plus report). Must be unique within a run.
    required: false
    default: agentsec-sarif
  python-version:
    description: >-
      Python set up with actions/setup-python (3.12 or newer). Empty skips setup and uses the
      runner's own python or python3, which must be 3.12 or newer.
    required: false
    default: "3.12"

outputs:
  sarif:
    description: Path to the SARIF file.
    value: ${{ steps.audit.outputs.sarif }}
  verdict:
    description: >-
      pass or fail (fail means a gating finding met fail-on), whatever the mode; error when the scan
      did not complete (no readable SARIF, a crash, or a guard killed over its time budget), and the
      step fails.
    value: ${{ steps.audit.outputs.verdict }}
  exit-code:
    description: agentsec's own exit code (0 pass, 1 gate tripped or a guard killed over its time budget).
    value: ${{ steps.audit.outputs.exit-code }}
  results:
    description: Number of results in the SARIF file.
    value: ${{ steps.audit.outputs.results }}

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.python-version != ''
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: agentsec audit
      id: audit
      shell: bash
      env:
        AGENTSEC_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        MODE: ${{ inputs.mode }}
        SCANNERS: ${{ inputs.scanners }}
        BASELINE: ${{ inputs.baseline }}
        BASELINE_SNAPSHOT: ${{ inputs.baseline-snapshot }}
        EXCLUDE: ${{ inputs.exclude }}
        TOP: ${{ inputs.top }}
        ANNOTATIONS: ${{ inputs.annotations }}
        COVERAGE: ${{ inputs.coverage }}
        UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        # `shell: bash` runs `bash -eo pipefail`. Errexit is turned off so agentsec's exit code can be
        # captured and judged below instead of aborting the step; every failure is handled by `die`.
        set +e -u -o pipefail

        # Workflow-command data escaping, so no value can start a second command on its own line.
        esc() { local s="${1//%/%25}"; s="${s//$'\r'/%0D}"; printf '%s' "${s//$'\n'/%0A}"; }
        die() { echo "::error title=agentsec action::$(esc "$1")"; exit 1; }

        case "$FAIL_ON" in critical|high|medium) ;; *) die "fail-on must be critical, high or medium, got: $FAIL_ON" ;; esac
        case "$MODE" in gate|advisory) ;; *) die "mode must be gate or advisory, got: $MODE" ;; esac
        case "$SCANNERS" in deterministic|guards-only|all) ;; *) die "scanners must be deterministic, guards-only or all, got: $SCANNERS" ;; esac
        case "$COVERAGE" in true|false) ;; *) die "coverage must be true or false, got: $COVERAGE" ;; esac
        case "$UPLOAD_SARIF" in true|false) ;; *) die "upload-sarif must be true or false, got: $UPLOAD_SARIF" ;; esac
        [[ "$TOP" =~ ^[0-9]+$ ]] || die "top must be a whole number, got: $TOP"
        [[ "$ANNOTATIONS" =~ ^[0-9]+$ ]] || die "annotations must be a whole number, got: $ANNOTATIONS"
        [ -d "$AGENTSEC_PATH" ] || die "path is not a directory in the checkout: $AGENTSEC_PATH"

        PY=python
        command -v "$PY" >/dev/null 2>&1 || PY=python3
        "$PY" -I -c 'import sys; sys.exit(sys.version_info < (3, 12))' 2>/dev/null \
          || die "agentsec needs Python 3.12 or newer on PATH (set the python-version input)"

        # A fresh directory per invocation, so two uses in one job never share or inherit files:
        # a stale SARIF from an earlier step must not satisfy the artifact check below.
        out_dir="${RUNNER_TEMP:-$PWD}/agentsec-$(date +%s)-$$-$RANDOM"
        mkdir -p "$out_dir" || die "could not create $out_dir"
        sarif="$out_dir/agentsec.sarif"
        report="$out_dir/agentsec-findings.md"
        echo "dir=$out_dir" >> "$GITHUB_OUTPUT"

        args=(audit "$AGENTSEC_PATH" --format summary --top "$TOP" --out "$report"
              --sarif-out "$sarif" --fail-on "$FAIL_ON" --annotations "$ANNOTATIONS")
        case "$SCANNERS" in
          deterministic) args+=(--deterministic) ;;
          guards-only) args+=(--guards-only) ;;
        esac
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        [ -n "$BASELINE_SNAPSHOT" ] && args+=(--baseline-snapshot "$BASELINE_SNAPSHOT")
        while IFS= read -r pattern || [ -n "$pattern" ]; do
          pattern="${pattern#"${pattern%%[![:space:]]*}"}"
          pattern="${pattern%"${pattern##*[![:space:]]}"}"
          [ -n "$pattern" ] && args+=(--exclude "$pattern")
        done <<< "$EXCLUDE"

        # The private-repo setup checks agentsec out INSIDE the workspace (`uses: ./.agentsec-action`),
        # so a scan of `.` would also scan agentsec's own source and its deliberately vulnerable fixtures.
        # Drop that subtree from the report, and say how to keep it out of the scan altogether.
        self_rel="$("$PY" -I -c '
        import os, sys
        action, root = (os.path.realpath(p) for p in sys.argv[1:3])
        inside = action != root and os.path.commonpath([action, root]) == root
        print(os.path.relpath(action, root).replace(os.sep, "/") if inside else "")
        ' "$GITHUB_ACTION_PATH" "$AGENTSEC_PATH" 2>/dev/null)" || self_rel=""
        if [ -n "$self_rel" ]; then
          args+=(--exclude "$self_rel")
          if ! git -C "$AGENTSEC_PATH" check-ignore -q -- "$self_rel" 2>/dev/null; then
            echo "::warning title=agentsec action::the action's own checkout ($(esc "$self_rel")) is inside the scanned path; its findings are dropped, but add it to .gitignore so it is not scanned (it changes the detected stack)"
          fi
        fi

        # Never --no-fail: agentsec's exit code is the honest verdict (0 pass, 1 gate tripped) and
        # advisory mode is applied by the last step, after the artifacts are uploaded.
        # PYTHONSAFEPATH=1 keeps the current directory (the scanned repo) off sys.path. Without it
        # `python -m` puts the checkout first, so a `json.py` or an `agentsec/` directory in the
        # repo under scan would be imported in place of the stdlib or the CLI (verified by hand).
        PYTHONPATH="$GITHUB_ACTION_PATH" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 \
          "$PY" -m agentsec "${args[@]}"
        rc=$?

        # The score card is informational: its own failure is a warning and never touches the
        # verdict, which is judged from the audit alone below.
        coverage="$out_dir/agentsec-coverage.md"
        if [ "$COVERAGE" = true ]; then
          PYTHONPATH="$GITHUB_ACTION_PATH" PYTHONSAFEPATH=1 PYTHONDONTWRITEBYTECODE=1 PYTHONIOENCODING=utf-8 \
            "$PY" -m agentsec coverage "$AGENTSEC_PATH" --out "$coverage" >/dev/null
          if [ "$?" -ne 0 ] || [ ! -s "$coverage" ]; then
            rm -f "$coverage"
            echo "::warning title=agentsec action::the coverage score card could not be generated; the audit verdict is unaffected"
          fi
        fi

        verdict=pass
        [ "$rc" -eq 1 ] && verdict=fail
        {
          echo "## agentsec security audit"
          echo
          echo "Scanned \`$AGENTSEC_PATH\` (scanners: $SCANNERS, gate: $FAIL_ON, mode: $MODE)."
          echo
          if [ -f "$report" ]; then
            if [ "$(wc -c < "$report")" -gt 900000 ]; then
              head -c 900000 "$report"
              echo
              echo "_Report truncated at the step-summary size limit; the full report is in the artifact._"
            else
              cat "$report"
            fi
          else
            echo "agentsec wrote no report (exit code $rc)."
          fi
          if [ -s "$coverage" ]; then
            echo
            echo "<details><summary>Checklist coverage score card</summary>"
            echo
            cat "$coverage"
            echo
            echo "</details>"
          fi
          if [[ "$ACTION_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            issues="${GITHUB_SERVER_URL:-https://github.com}/$ACTION_REPO/issues/new"
            echo
            echo "---"
            echo "False positive? [Report it]($issues?template=false-positive.yml)." \
                 "Missed something? [Report a missed detection]($issues?template=missed-detection.yml)."
            echo "Your code never left this runner; the links only open an issue form."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # Assert the artifact, never the exit code: a run that wrote no readable SARIF did not
        # complete, whatever it exited with, and fails the job in every mode. A guard killed over
        # its time budget exits 1 like a tripped gate (#677); only the SARIF's error notification
        # says the scan is PARTIAL, so it is counted here and fails the job in every mode too.
        parsed="$(PYTHONIOENCODING=utf-8 "$PY" -I -c '
        import json, sys
        with open(sys.argv[1], encoding="utf-8") as fh:
            runs = json.load(fh)["runs"]
        killed = sum(1 for run in runs for inv in run.get("invocations") or []
                     for note in inv.get("toolExecutionNotifications") or []
                     if (note.get("descriptor") or {}).get("id") == "agentsec/guard-budget-exceeded")
        print(sum(len(run.get("results") or []) for run in runs), killed)
        ' "$sarif" 2>/dev/null)" || parsed=""
        read -r results killed <<< "$parsed"
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        if [ -z "$results" ]; then
          echo "verdict=error" >> "$GITHUB_OUTPUT"
          die "agentsec produced no readable SARIF (exit code $rc); the scan did not complete"
        fi
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
          echo "verdict=error" >> "$GITHUB_OUTPUT"
          die "agentsec exited $rc, which is a crash rather than a verdict"
        fi
        if [ "${killed:-0}" -gt 0 ]; then
          verdict=error
        fi
        {
          echo "sarif=$sarif"
          echo "verdict=$verdict"
          echo "results=$results"
        } >> "$GITHUB_OUTPUT"
        if [ "$verdict" = error ]; then
          die "$killed guard(s) exceeded the per-guard time budget and were killed, so the scan is PARTIAL; see the job summary"
        fi

    - name: Upload agentsec artifact
      if: always() && steps.audit.outputs.dir != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.audit.outputs.dir }}
        if-no-files-found: warn
        retention-days: 30

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true' && steps.audit.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
      with:
        sarif_file: ${{ steps.audit.outputs.sarif }}
        category: ${{ inputs.sarif-category }}

    - name: agentsec gate
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
      run: |
        case "$EXIT_CODE" in
          0) echo "agentsec: gate passed" ;;
          1)
            if [ "$MODE" = advisory ]; then
              echo "::warning title=agentsec (advisory)::findings at or above fail-on; advisory mode does not fail the job"
              exit 0
            fi
            echo "::error title=agentsec::findings at or above fail-on; see the job summary"
            exit 1
            ;;
          *) echo "::error title=agentsec::no verdict from the audit step (exit code '$EXIT_CODE')"; exit 1 ;;
        esac
