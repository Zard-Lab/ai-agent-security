name: Release

# Publishes a signed vX.Y.Z tag to TestPyPI, then (after a maintainer approves the `pypi` environment) to
# PyPI, through Trusted Publishing: PyPI exchanges this job's OIDC token for a short-lived upload token, so
# no long-lived PyPI credential exists anywhere. A release needs three separate things: the release signing
# key (the `verify` job), push access to this repo for the tag, and an approval of the `pypi` environment.
#
# Part of PyPI's trust configuration, so renaming breaks publishing: this file's NAME (`release.yml`) and
# the environment names `testpypi` and `pypi`. Keep it a top-level workflow: PyPI does not accept a
# reusable workflow as the trusted one. Never add workflow_dispatch, workflow_run or pull_request_target:
# a trigger other than the tag push would skip the signed-tag check.
#
# Every job runs on a GitHub-hosted runner. This repo is public, so a self-hosted runner here would run
# code from any fork PR, and the publish action supports self-hosted runners only on a best-effort basis.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: tag is a signed release of this tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Assert tag name == checklist version == versions.json latest
        run: python scripts/check-release-tag.py "${GITHUB_REF_NAME}"

      # The key is pinned HERE, as a literal in this file, never read from the tagged tree: a tree that
      # supplied its own key could vouch for itself. Fingerprint, for humans:
      #   SHA256:l6gr17WhTsGVNFa7+TMxaPOyVhl3HmSS10b+d7pD6g4
      # It must equal the key SECURITY.md publishes; the maintainers' gate binds the two.
      # `git verify-tag` prints `Good "git" signature` even when the principal does not match and it exits
      # 1, so the exit status is the only signal; nothing is piped into or out of it.
      - name: Assert the tag is annotated and signed by the pinned release key
        env:
          RELEASE_SIGNING_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDuzAFGkYiIkLLglr11b+jvK3o/E09+b9z+8OmTjIe+6"
          TAGGER_EMAIL: "dean.prichard@gmail.com"
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          kind="$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")"
          if [ "${kind}" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag (${kind}); a release tag must be annotated and signed"
            exit 1
          fi
          # Every job checks out GITHUB_SHA; the signature below is checked on the tag as fetched now. They
          # must be the same commit, or a tag moved after the push would verify one tree and build another.
          tagged="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          if [ "${tagged}" != "${GITHUB_SHA}" ]; then
            echo "::error::${GITHUB_REF_NAME} now points at ${tagged}, but this run builds ${GITHUB_SHA}"
            exit 1
          fi
          printf '%s %s\n' "${TAGGER_EMAIL}" "${RELEASE_SIGNING_KEY}" > "${RUNNER_TEMP}/allowed_signers"
          git -c gpg.format=ssh \
              -c gpg.ssh.allowedSignersFile="${RUNNER_TEMP}/allowed_signers" \
              verify-tag "${GITHUB_REF_NAME}"

  build:
    name: build and check the sdist and wheel
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          set -euo pipefail
          python -m pip install "build==1.6.1"
          python -m build

      # The last look before anything becomes public for good: only the allowlisted sdist roots, nothing
      # private, a wheel of just the package, both named for the tag's version.
      - name: Check the artifacts
        run: python scripts/check_dist.py dist/ --version "${GITHUB_REF_NAME#v}"

      - name: Upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ai-agent-security
    permissions:
      id-token: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      # skip-existing: a re-run of this workflow (say, after a declined `pypi` approval) must not fail
      # here on the version TestPyPI already holds. TestPyPI only; the real upload never skips.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ai-agent-security
    permissions:
      id-token: write
    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      # Attestations are on by default: PyPI shows the provenance of each file. Leave them on.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Download the artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          { grep -m1 -F -e "- **${GITHUB_REF_NAME}**" -e "## ${GITHUB_REF_NAME} " CHANGELOG.md || true
            echo
            echo "Install: \`pipx install ai-agent-security==${GITHUB_REF_NAME#v}\`"
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
