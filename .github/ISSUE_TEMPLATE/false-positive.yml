name: False positive
description: A guard fired on code that is not actually a vulnerability
title: "[FP] <guard-id>: "
labels: ["false-positive", "area:guard"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — false positives are the single most useful thing you can report. agentsec's
        whole precision loop is fed by them, and a report with a runnable snippet goes straight
        into the guard-improvement ledger.

        **Before filing:** if you are unsure whether it is a false positive, open a
        [Q&A discussion](../discussions/categories/q-a) instead. That is what it is for, and it
        converts to an issue in one click if it turns out to be real.

  - type: input
    id: guard
    attributes:
      label: Guard / check id
      description: The `[check-id]` in square brackets on the report line, e.g. `cors-wildcard`.
      placeholder: rls-permissive-policy
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: agentsec version
      description: Output of `agentsec --version`.
      placeholder: 0.21.13
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: The finding, as reported
      description: Paste the whole report line (severity, check id, location, message).
      render: text
    validations:
      required: true

  - type: textarea
    id: snippet
    attributes:
      label: Minimal code that triggers it
      description: >
        The smallest snippet that still fires. This is the field that decides whether the report
        is actionable — it becomes the FP-bait test that stops the bug coming back.
      render: python
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this is not a real vulnerability
      description: >
        What makes the code safe? A mitigation elsewhere in the file, a framework guarantee, a
        value that cannot be attacker-controlled?
    validations:
      required: true

  - type: dropdown
    id: pragma
    attributes:
      label: Did an inline allow-pragma suppress it?
      description: Several guards honour an inline opt-out. Knowing this tells us whether you had a workaround.
      options:
        - "Not tried"
        - "Yes — the pragma worked, but the finding is still wrong"
        - "No — the pragma did not suppress it"
        - "This guard has no pragma"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Stack context (optional)
      description: The `_Stack:_` line from the report, if the detected stack seems relevant.
