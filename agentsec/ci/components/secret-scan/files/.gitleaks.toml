# Gitleaks configuration (installed by `agentsec ci add secret-scan`).
#
# Extends the default gitleaks ruleset and allowlists only GENERIC, reusable
# paths: example/template env files, test/eval fixtures, and lockfiles. Anything
# else that trips a rule is treated as an accidental leak and should be rotated.
#
# Add your OWN allowlist entries here for any file that INTENTIONALLY carries a
# real secret (rare — prefer not committing secrets at all). Keep the list as
# tight as possible: a path entry blinds the scanner for that path forever.

title = "agentsec gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generic: example/template env files, test/eval fixtures, and lockfiles"

paths = [
  # Example / template env files (no real secrets by convention)
  '''\.env\..*example.*$''',
  '''\.env\.sample$''',

  # Test / eval fixtures with fake secrets
  '''(^|/)tests?/''',
  '''(^|/)evals/''',

  # Lockfiles (hashes, not secrets)
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  '''bun\.lockb$''',
  '''requirements-locked\.txt$''',
  '''\.lock$''',
]
